name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      # The suite runs from recorded fixtures, so CI never calls PubMed or OpenAlex.
      - run: pytest --cov=research_harvest --cov-report=term-missing --cov-fail-under=90

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  smoke:
    name: End-to-end against the live APIs
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Only on the default branch: this one really does call PubMed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Harvest a handful of real records
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          set -euo pipefail
          research-harvest "blood brain barrier machine learning" \
            --limit 5 --require-abstract --format csv -o out/smoke.csv
          test -s out/smoke.csv
          python - <<'PY'
          import csv, pathlib, sys
          rows = list(csv.DictReader(pathlib.Path("out/smoke.csv").open(encoding="utf-8")))
          assert rows, "no records returned"
          assert all(r["title"] and r["abstract"] for r in rows), "incomplete records"
          print(f"Smoke test fetched {len(rows)} record(s).")
          PY
